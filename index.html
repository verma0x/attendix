<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f7fb">

<title>Attendix</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =========================
   COLORS
========================= */

:root {
    --bg: #f7f7fb;
    --white: #ffffff;
    --text: #171820;
    --muted: #898c9c;

    --border: #ececf2;

    --purple: #6657e8;
    --purple-light: #eeebff;

    --green: #2fb477;
    --green-light: #e8f8f0;

    --red: #e65b5b;
    --red-light: #fdecec;
}


/* =========================
   BODY
========================= */

body {
    min-height: 100vh;

    background: var(--bg);

    color: var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================
   APP
========================= */

.app {
    width: 100%;
    max-width: 480px;

    min-height: 100vh;

    margin: auto;

    padding: 20px 16px 100px;
}


/* =========================
   HEADER
========================= */

header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 5px 2px 22px;
}


.brand {
    display: flex;

    align-items: center;

    gap: 11px;
}


.logo {
    width: 45px;
    height: 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 15px;

    background: var(--purple);

    color: white;

    font-size: 22px;
    font-weight: 900;

    box-shadow:
        0 8px 20px rgba(102, 87, 232, 0.25);
}


.brand h1 {
    font-size: 23px;

    letter-spacing: -0.7px;
}


.brand p {
    margin-top: 2px;

    color: var(--muted);

    font-size: 10px;
}


.today-button {
    width: 40px;
    height: 40px;

    border: 1px solid var(--border);

    border-radius: 13px;

    background: white;

    color: var(--purple);

    font-size: 18px;

    cursor: pointer;
}


/* =========================
   CARD
========================= */

.card {
    background: white;

    border: 1px solid var(--border);

    border-radius: 22px;

    box-shadow:
        0 10px 30px rgba(30, 28, 70, 0.06);
}


/* =========================
   CALENDAR
========================= */

.calendar-card {
    padding: 18px;

    margin-bottom: 14px;
}


.calendar-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}


.month-name {
    font-size: 18px;

    font-weight: 800;
}


.year {
    display: block;

    margin-top: 2px;

    color: var(--muted);

    font-size: 10px;

    font-weight: 600;
}


.month-buttons {
    display: flex;

    gap: 5px;
}


.month-buttons button {
    width: 35px;
    height: 35px;

    border: none;

    border-radius: 10px;

    background: #f5f4fa;

    color: var(--text);

    font-size: 18px;

    cursor: pointer;
}


.month-buttons button:active {
    transform: scale(0.92);
}


/* =========================
   WEEKDAYS
========================= */

.weekdays,
.calendar {
    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 5px;
}


.weekdays div {
    text-align: center;

    color: #a0a2ad;

    font-size: 9px;

    font-weight: 800;

    padding-bottom: 7px;
}


/* =========================
   CALENDAR DAY
========================= */

.day {
    height: 49px;

    border: none;

    border-radius: 14px;

    background: transparent;

    color: var(--text);

    font-size: 12px;

    font-weight: 750;

    cursor: pointer;

    position: relative;

    transition: 0.15s;
}


.day:active {
    transform: scale(0.92);
}


.day.empty {
    cursor: default;
}


/* =========================
   TODAY
   Transparent Purple
========================= */

.day.today {
    background:
        rgba(102, 87, 232, 0.08);

    color: var(--purple);

    box-shadow:
        inset 0 0 0 1.5px
        rgba(102, 87, 232, 0.45);
}


.day.today .number {
    color: var(--purple);

    font-weight: 900;
}


/* =========================
   PRESENT
========================= */

.day.present {
    background: var(--green-light);

    color: #168258;
}


/* =========================
   ABSENT
========================= */

.day.absent {
    background: var(--red-light);

    color: #b73737;
}


/* =========================
   SELECTED DATE
========================= */

.day.selected {
    box-shadow:
        inset 0 0 0 2px var(--purple),

        0 4px 10px
        rgba(102, 87, 232, 0.12);

    transform: scale(0.94);
}


/* Selected + Present */

.day.selected.present {
    background: var(--green-light);

    box-shadow:
        inset 0 0 0 2px var(--green);
}


/* Selected + Absent */

.day.selected.absent {
    background: var(--red-light);

    box-shadow:
        inset 0 0 0 2px var(--red);
}


/* =========================
   STATUS DOT
========================= */

.status-dot {
    position: absolute;

    width: 5px;
    height: 5px;

    left: 50%;
    bottom: 5px;

    transform: translateX(-50%);

    border-radius: 50%;
}


.day.present .status-dot {
    background: var(--green);
}


.day.absent .status-dot {
    background: var(--red);
}


/* =========================
   LEGEND
========================= */

.legend {
    display: flex;

    justify-content: center;

    gap: 18px;

    margin-top: 15px;

    color: var(--muted);

    font-size: 10px;
}


.dot {
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 5px;

    border-radius: 50%;
}


.dot.green {
    background: var(--green);
}


.dot.red {
    background: var(--red);
}


/* =========================
   PRESENT / ABSENT PANEL

   Hidden until a date
   is selected.
========================= */

.quick-attendance {
    display: none;

    margin-top: 16px;

    padding-top: 15px;

    border-top: 1px solid var(--border);
}


.quick-attendance.show {
    display: block;

    animation:
        slideUp 0.2s ease;
}


@keyframes slideUp {

    from {
        opacity: 0;

        transform:
            translateY(5px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }

}


/* =========================
   SELECTED DATE INFO
========================= */

.selected-info {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 10px;
}


.selected-info strong {
    font-size: 11px;
}


.selected-info span {
    color: var(--muted);

    font-size: 9px;

    text-align: right;
}


/* =========================
   ATTENDANCE BUTTONS
========================= */

.quick-buttons {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}


.quick-buttons button {
    padding: 12px;

    border: none;

    border-radius: 12px;

    font-size: 10px;

    font-weight: 850;

    cursor: pointer;

    transition: 0.15s;
}


.quick-buttons button:active {
    transform: scale(0.96);
}


.quick-present {
    background: var(--green-light);

    color: #168258;
}


.quick-absent {
    background: var(--red-light);

    color: #b73737;
}


/* =========================
   ATTENDANCE SUMMARY
========================= */

.attendance-card {
    padding: 20px;

    margin-bottom: 14px;
}


.attendance-header {
    display: flex;

    justify-content: space-between;

    align-items: flex-start;
}


.label {
    color: var(--muted);

    font-size: 9px;

    font-weight: 850;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.percentage {
    margin-top: 5px;

    font-size: 43px;

    font-weight: 900;

    letter-spacing: -2px;
}


.percentage span {
    color: var(--muted);

    font-size: 18px;

    letter-spacing: 0;
}


/* =========================
   STATUS
========================= */

.status {
    padding: 8px 10px;

    border-radius: 10px;

    font-size: 9px;

    font-weight: 850;
}


.safe {
    background: var(--green-light);

    color: #168258;
}


.warning {
    background: #fff5dd;

    color: #a87816;
}


.danger {
    background: var(--red-light);

    color: #b73737;
}


/* =========================
   PROGRESS
========================= */

.progress {
    height: 9px;

    margin: 15px 0 13px;

    background: #f0f0f4;

    border-radius: 100px;

    overflow: hidden;
}


.progress-fill {
    height: 100%;

    width: 0;

    background: var(--green);

    border-radius: 100px;

    transition:
        width 0.3s ease;
}


/* =========================
   COUNTERS
========================= */

.counters {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;
}


.counter {
    padding: 12px;

    background: #fafafd;

    border: 1px solid var(--border);

    border-radius: 13px;
}


.counter strong {
    display: block;

    font-size: 18px;
}


.counter span {
    color: var(--muted);

    font-size: 9px;
}


/* =========================
   TIP
========================= */

.tip {
    margin-top: 12px;

    padding: 11px 12px;

    background: var(--purple-light);

    color: #5648bd;

    border-radius: 13px;

    font-size: 10px;

    line-height: 1.5;

    font-weight: 650;
}


/* =========================
   RESET BUTTON
========================= */

.reset {
    width: 100%;

    margin-top: 14px;

    padding: 10px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background: white;

    color: var(--muted);

    font-size: 10px;

    font-weight: 700;

    cursor: pointer;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
    position: fixed;

    left: 50%;
    bottom: 0;

    transform:
        translateX(-50%);

    width: min(480px, 100%);

    padding:
        9px 18px
        calc(
            9px +
            env(safe-area-inset-bottom)
        );

    background:
        rgba(255,255,255,0.94);

    backdrop-filter:
        blur(15px);

    border-top:
        1px solid var(--border);

    z-index: 100;
}


.nav-items {
    display: flex;

    justify-content:
        space-around;
}


.nav-item {
    text-align: center;

    color: #9b9daa;

    font-size: 9px;

    font-weight: 750;
}


.nav-item-icon {
    margin-bottom: 3px;

    font-size: 18px;
}


.nav-item.active {
    color: var(--purple);
}


/* =========================
   DESKTOP
========================= */

@media (min-width: 481px) {

    body {
        padding: 20px 0;
    }

    .bottom-nav {
        bottom: 20px;

        border:
            1px solid var(--border);

        border-radius: 20px;
    }

}

</style>
</head>


<body>


<div class="app">


    <!-- =====================
         HEADER
    ====================== -->

    <header>

        <div class="brand">

            <div class="logo">
                ✓
            </div>

            <div>

                <h1>
                    Attendix
                </h1>

                <p>
                    Smart attendance tracker
                </p>

            </div>

        </div>


        <button
            class="today-button"
            id="todayButton">

            ⌾

        </button>

    </header>



    <!-- =====================
         CALENDAR
    ====================== -->

    <section
        class="card calendar-card">


        <div class="calendar-header">


            <div>

                <div
                    class="month-name"
                    id="monthName">
                </div>

                <span
                    class="year"
                    id="year">
                </span>

            </div>


            <div
                class="month-buttons">

                <button
                    id="previousMonth">
                    ‹
                </button>

                <button
                    id="nextMonth">
                    ›
                </button>

            </div>


        </div>



        <!-- WEEKDAYS -->

        <div class="weekdays">

            <div>S</div>
            <div>M</div>
            <div>T</div>
            <div>W</div>
            <div>T</div>
            <div>F</div>
            <div>S</div>

        </div>



        <!-- DAYS -->

        <div
            class="calendar"
            id="calendar">
        </div>



        <!-- LEGEND -->

        <div class="legend">

            <span>

                <i class="dot green"></i>

                Present

            </span>


            <span>

                <i class="dot red"></i>

                Absent

            </span>

        </div>



        <!-- ==================
             QUICK ATTENDANCE

             Hidden initially.
             Appears when a date
             is selected.
        =================== -->

        <div
            class="quick-attendance"
            id="quickAttendance">


            <div class="selected-info">


                <strong
                    id="selectedDate">

                    Select a date

                </strong>


                <span
                    id="selectedStatus">

                    Not marked yet

                </span>


            </div>



            <div class="quick-buttons">


                <button
                    class="quick-present"
                    id="presentButton">

                    ✓ Present

                </button>


                <button
                    class="quick-absent"
                    id="absentButton">

                    ✕ Absent

                </button>


            </div>


        </div>


    </section>



    <!-- =====================
         ATTENDANCE SUMMARY
    ====================== -->

    <section
        class="card attendance-card">


        <div
            class="attendance-header">


            <div>


                <div class="label">

                    Overall Attendance

                </div>


                <div
                    class="percentage"
                    id="percentage">

                    0<span>%</span>

                </div>


            </div>


            <div
                class="status"
                id="status">

                No data

            </div>


        </div>



        <!-- PROGRESS BAR -->

        <div class="progress">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>



        <!-- COUNTERS -->

        <div class="counters">


            <div class="counter">

                <strong
                    id="presentCount">

                    0

                </strong>

                <span>

                    Present classes

                </span>

            </div>


            <div class="counter">

                <strong
                    id="absentCount">

                    0

                </strong>

                <span>

                    Absent classes

                </span>

            </div>


        </div>



        <!-- TIP -->

        <div
            class="tip"
            id="tip">

            Start by selecting a date
            on the calendar.

        </div>



        <!-- RESET -->

        <button
            class="reset"
            id="resetButton">

            Reset all attendance

        </button>


    </section>


</div>



<!-- =========================
     BOTTOM NAVIGATION
========================== -->

<nav class="bottom-nav">


    <div class="nav-items">


        <div
            class="nav-item active">

            <div class="nav-item-icon">
                ▦
            </div>

            Attendance

        </div>


        <div
            class="nav-item">

            <div class="nav-item-icon">
                ◷
            </div>

            History

        </div>


        <div
            class="nav-item">

            <div class="nav-item-icon">
                ⚙
            </div>

            Settings

        </div>


    </div>


</nav>



<script>

/* =========================
   STORAGE
========================= */

const STORAGE_KEY =
    "attendixAttendance";


let attendance =
    JSON.parse(
        localStorage.getItem(
            STORAGE_KEY
        ) || "{}"
    );


let currentDate =
    new Date();


let selectedDate =
    null;



/* =========================
   SHORTCUT
========================= */

function $(id) {

    return document.getElementById(id);

}



/* =========================
   DATE KEY
========================= */

function makeKey(
    year,
    month,
    day
) {

    return (

        year +
        "-" +
        String(month + 1)
            .padStart(2, "0") +
        "-" +
        String(day)
            .padStart(2, "0")

    );

}



/* =========================
   SAVE
========================= */

function saveData() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(
            attendance
        )

    );

}



/* =========================
   RENDER CALENDAR
========================= */

function renderCalendar() {


    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();



    /* MONTH NAME */

    $("monthName")
        .textContent =
        currentDate.toLocaleString(
            "en-US",
            {
                month: "long"
            }
        );


    $("year")
        .textContent =
        year;



    const calendar =
        $("calendar");


    calendar.innerHTML = "";



    /* FIRST DAY */

    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();



    /* NUMBER OF DAYS */

    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();



    /* EMPTY DAYS */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {


        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "day empty";


        calendar.appendChild(
            empty
        );

    }



    /* TODAY */

    const today =
        new Date();



    /* CREATE DAYS */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {


        const dateKey =
            makeKey(
                year,
                month,
                day
            );


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "day";


        button.innerHTML = `

            <span class="number">

                ${day}

            </span>

        `;



        /* PRESENT / ABSENT */

        if (
            attendance[dateKey]
        ) {


            button.classList.add(

                attendance[dateKey]

            );


            const dot =
                document.createElement(
                    "span"
                );


            dot.className =
                "status-dot";


            button.appendChild(
                dot
            );

        }



        /* TODAY */

        if (

            year ===
            today.getFullYear()

            &&

            month ===
            today.getMonth()

            &&

            day ===
            today.getDate()

        ) {

            button.classList.add(
                "today"
            );

        }



        /* SELECTED */

        if (
            dateKey ===
            selectedDate
        ) {

            button.classList.add(
                "selected"
            );

        }



        /* CLICK */

        button.addEventListener(
            "click",
            function () {

                selectDate(
                    dateKey
                );

            }
        );


        calendar.appendChild(
            button
        );

    }



    updateStatistics();

}



/* =========================
   SELECT DATE
========================= */

function selectDate(
    dateKey
) {


    selectedDate =
        dateKey;



    /*
       SHOW PRESENT /
       ABSENT BUTTONS
    */

    $("quickAttendance")
        .classList.add(
            "show"
        );



    /* DATE */

    const date =
        new Date(
            dateKey +
            "T00:00:00"
        );


    $("selectedDate")
        .textContent =
        date.toLocaleDateString(
            "en-US",
            {
                weekday: "short",
                month: "short",
                day: "numeric"
            }
        );



    /* STATUS */

    if (
        attendance[dateKey] ===
        "present"
    ) {


        $("selectedStatus")
            .textContent =
            "Currently Present";


    }

    else if (
        attendance[dateKey] ===
        "absent"
    ) {


        $("selectedStatus")
            .textContent =
            "Currently Absent";


    }

    else {


        $("selectedStatus")
            .textContent =
            "Not marked yet";

    }



    /*
       Re-render calendar
       to show selection.
    */

    renderCalendar();

}



/* =========================
   MARK ATTENDANCE
========================= */

function markAttendance(
    status
) {


    if (!selectedDate) {

        return;

    }



    /* SAVE */

    attendance[
        selectedDate
    ] = status;


    saveData();



    /* UPDATE */

    renderCalendar();


    selectDate(
        selectedDate
    );

}



/* =========================
   STATISTICS
========================= */

function updateStatistics() {


    const values =
        Object.values(
            attendance
        );


    const present =
        values.filter(
            value =>
                value ===
                "present"
        ).length;


    const absent =
        values.filter(
            value =>
                value ===
                "absent"
        ).length;


    const total =
        present + absent;



    let percentage = 0;


    if (total > 0) {

        percentage =
            (present / total) * 100;

    }



    /* COUNTERS */

    $("presentCount")
        .textContent =
        present;


    $("absentCount")
        .textContent =
        absent;



    /* PERCENTAGE */

    $("percentage")
        .innerHTML =

        (
            total
            ? percentage.toFixed(1)
            : "0"
        )

        +

        "<span>%</span>";



    /* PROGRESS */

    $("progressFill")
        .style.width =
        percentage + "%";



    /* STATUS */

    const status =
        $("status");


    status.className =
        "status";



    if (total === 0) {


        status.textContent =
            "No data";


        $("tip")
            .textContent =
            "Start by selecting a date on the calendar.";

    }


    else if (
        percentage >= 75
    ) {


        status.textContent =
            "✓ Safe";


        status.classList.add(
            "safe"
        );


        $("tip")
            .textContent =
            "Great! Your attendance is above the 75% target.";

    }


    else if (
        percentage >= 60
    ) {


        status.textContent =
            "⚠ Attention";


        status.classList.add(
            "warning"
        );


        $("tip")
            .textContent =
            "Your attendance is getting close to the 75% target.";

    }


    else {


        status.textContent =
            "✕ Low";


        status.classList.add(
            "danger"
        );


        $("tip")
            .textContent =
            "Your attendance is below 75%. Try to attend upcoming classes.";

    }

}



/* =========================
   PREVIOUS MONTH
========================= */

$("previousMonth")
    .addEventListener(
        "click",
        function () {


            currentDate.setMonth(

                currentDate.getMonth() - 1

            );


            renderCalendar();

        }
    );



/* =========================
   NEXT MONTH
========================= */

$("nextMonth")
    .addEventListener(
        "click",
        function () {


            currentDate.setMonth(

                currentDate.getMonth() + 1

            );


            renderCalendar();

        }
    );



/* =========================
   TODAY BUTTON
========================= */

$("todayButton")
    .addEventListener(
        "click",
        function () {


            currentDate =
                new Date();


            renderCalendar();

        }
    );



/* =========================
   PRESENT
========================= */

$("presentButton")
    .addEventListener(
        "click",
        function () {

            markAttendance(
                "present"
            );

        }
    );



/* =========================
   ABSENT
========================= */

$("absentButton")
    .addEventListener(
        "click",
        function () {

            markAttendance(
                "absent"
            );

        }
    );



/* =========================
   RESET
========================= */

$("resetButton")
    .addEventListener(
        "click",
        function () {


            const confirmed =
                confirm(
                    "Reset all attendance data?"
                );


            if (confirmed) {


                attendance = {};


                selectedDate =
                    null;


                localStorage.removeItem(
                    STORAGE_KEY
                );


                $("quickAttendance")
                    .classList.remove(
                        "show"
                    );


                renderCalendar();

            }

        }
    );



/* =========================

========================= */

renderCalendar();

</script>
