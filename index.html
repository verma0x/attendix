<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendix | verma0x </title>

<style>

/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =========================================
   LIGHT THEME
========================================= */

:root {

    --bg: radial-gradient(circle at 50% 20%, rgba(102, 87, 232, 0.18) 0%, rgba(247, 247, 251, 0) 60%),
          radial-gradient(circle at 80% 80%, rgba(102, 87, 232, 0.12) 0%, rgba(247, 247, 251, 0) 50%),
          #f7f7fb;
    --card: #ffffff;
    --text: #171820;
    --muted: #8c8d9b;

    --purple: #6657e8;
    --purple-soft: rgba(102, 87, 232, 0.09);

    --green: #2fb477;
    --green-soft: #e8f8f0;

    --red: #e65b5b;
    --red-soft: #fdecec;

    --border: #ececf2;

    --soft: #f5f4fa;
}


/* =========================================
   DARK THEME
========================================= */

body.dark {

    --bg: radial-gradient(circle at 50% 20%, rgba(130, 117, 245, 0.25) 0%, rgba(15, 16, 22, 0) 65%),
          radial-gradient(circle at 80% 80%, rgba(130, 117, 245, 0.15) 0%, rgba(15, 16, 22, 0) 50%),
          #0f1016;
    --card: #181922;
    --text: #f4f4f7;
    --muted: #9294a3;

    --purple: #8275f5;
    --purple-soft: rgba(130, 117, 245, 0.12);

    --green: #3bc98b;
    --green-soft: rgba(59, 201, 139, 0.13);

    --red: #ff7070;
    --red-soft: rgba(255, 112, 112, 0.13);

    --border: #292b36;

    --soft: #22232d;
}


/* =========================================
   BODY
========================================= */

body {

    min-height: 100vh;

    background: var(--bg);
    background-attachment: fixed;
    background-repeat: no-repeat;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    transition:
        background 0.25s ease,
        color 0.25s ease;
}


/* =========================================
   APP
========================================= */

.app {

    width: 100%;

    max-width: 480px;

    margin: auto;

    padding:
        20px 16px 100px;
}


/* =========================================
   HEADER
========================================= */

header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}


.brand {

    display: flex;

    align-items: center;

    gap: 11px;
}


.logo {

    width: 45px;
    height: 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 15px;

    background: var(--purple);

    color: white;

    font-size: 22px;

    font-weight: 900;

    box-shadow:
        0 8px 20px
        rgba(102, 87, 232, 0.25);
}


.brand h1 {

    font-size: 23px;

    letter-spacing: -0.5px;
}


.brand p {

    margin-top: 2px;

    color: var(--muted);

    font-size: 10px;
}


/* =========================================
   HEADER BUTTONS
========================================= */

.header-buttons {

    display: flex;

    gap: 7px;
}


.header-btn {

    width: 40px;
    height: 40px;

    border:
        1px solid var(--border);

    border-radius: 13px;

    background: var(--card);

    color: var(--purple);

    font-size: 17px;

    cursor: pointer;

    transition: 0.2s;
}


.header-btn:active {

    transform: scale(0.9);
}


/* =========================================
   CARD
========================================= */

.card {

    background: var(--card);

    border:
        1px solid var(--border);

    border-radius: 22px;

    box-shadow:
        0 10px 30px
        rgba(30, 28, 70, 0.06);

    transition:
        background 0.25s ease,
        border 0.25s ease;
}


/* =========================================
   CALENDAR CARD
========================================= */

.calendar-card {

    padding: 18px;

    margin-bottom: 15px;
}


.calendar-top {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}


.month {

    font-size: 18px;

    font-weight: 800;
}


.year {

    display: block;

    margin-top: 2px;

    color: var(--muted);

    font-size: 10px;
}


.month-controls {

    display: flex;

    gap: 5px;
}


.month-controls button {

    width: 35px;
    height: 35px;

    border: none;

    border-radius: 10px;

    background: var(--soft);

    color: var(--text);

    font-size: 18px;

    cursor: pointer;
}


/* =========================================
   WEEK DAYS
========================================= */

.weekdays {

    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 5px;

    margin-bottom: 6px;
}


.weekdays div {

    text-align: center;

    color: var(--muted);

    font-size: 9px;

    font-weight: 800;
}


/* =========================================
   CALENDAR
========================================= */

.calendar {

    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 5px;
}


/* =========================================
   DAY WRAPPER
========================================= */

.day-wrapper {

    position: relative;

    min-width: 0;

    display: flex;

    justify-content: center;
}


/* =========================================
   DAY
========================================= */

.day {

    width: 100%;

    height: 48px;

    border: none;

    border-radius: 14px;

    background: transparent;

    color: var(--text);

    font-size: 12px;

    font-weight: 750;

    cursor: pointer;

    position: relative;

    transition: 0.15s;
}


.day:active {

    transform: scale(0.92);
}


/* =========================================
   TODAY
========================================= */

.day.today {

    background:
        rgba(102, 87, 232, 0.08);

    color: var(--purple);

    box-shadow:
        inset 0 0 0 1.5px
        rgba(102, 87, 232, 0.4);
}


/* =========================================
   PRESENT
========================================= */

.day.present {

    background: var(--green-soft);

    color: var(--green);
}


/* =========================================
   ABSENT
========================================= */

.day.absent {

    background: var(--red-soft);

    color: var(--red);
}


/* =========================================
   SELECTED
========================================= */

.day.selected {

    box-shadow:
        inset 0 0 0 2px var(--purple);

    transform: scale(0.94);

    z-index: 10;
}


.day.selected.present {

    box-shadow:
        inset 0 0 0 2px var(--green);
}


.day.selected.absent {

    box-shadow:
        inset 0 0 0 2px var(--red);
}


/* =========================================
   STATUS DOT
========================================= */

.status-dot {

    position: absolute;

    width: 5px;
    height: 5px;

    bottom: 5px;

    left: 50%;

    transform:
        translateX(-50%);

    border-radius: 50%;
}


.day.present .status-dot {

    background: var(--green);
}


.day.absent .status-dot {

    background: var(--red);
}


/* =========================================
   ATTENDANCE POPUP
========================================= */

.attendance-popup {

    position: absolute;

    top: 53px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 50;

    display: none;

    width: 112px;

    padding: 5px;

    background: var(--card);

    border:
        1px solid var(--border);

    border-radius: 12px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.18);
}


.day-wrapper.active
.attendance-popup {

    display: flex;

    gap: 4px;

    animation:
        popupIn 0.16s ease;
}


@keyframes popupIn {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(-4px)
            scale(0.95);
    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }
}


/* =========================================
   POPUP BUTTONS
========================================= */

.attendance-popup button {

    flex: 1;

    border: none;

    border-radius: 8px;

    padding: 8px 4px;

    font-size: 9px;

    font-weight: 850;

    cursor: pointer;
}


.popup-present {

    background: var(--green-soft);

    color: var(--green);
}


.popup-absent {

    background: var(--red-soft);

    color: var(--red);
}


/* =========================================
   LEGEND
========================================= */

.legend {

    display: flex;

    justify-content: center;

    gap: 18px;

    margin-top: 16px;

    color: var(--muted);

    font-size: 10px;
}


.legend-dot {

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 4px;

    border-radius: 50%;
}


.legend-green {

    background: var(--green);
}


.legend-red {

    background: var(--red);
}


/* =========================================
   ATTENDANCE CARD
========================================= */

.attendance-card {

    padding: 20px;
}


.attendance-header {

    display: flex;

    align-items: flex-start;

    justify-content: space-between;
}


.label {

    color: var(--muted);

    font-size: 9px;

    font-weight: 850;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.percentage {

    margin-top: 5px;

    font-size: 43px;

    font-weight: 900;

    letter-spacing: -2px;
}


.percentage span {

    color: var(--muted);

    font-size: 18px;

    letter-spacing: 0;
}


/* =========================================
   STATUS
========================================= */

.status {

    padding: 8px 10px;

    border-radius: 10px;

    font-size: 9px;

    font-weight: 850;
}


.safe {

    background: var(--green-soft);

    color: var(--green);
}


.warning {

    background: #fff5dd;

    color: #a87816;
}


body.dark .warning {

    background:
        rgba(255, 190, 60, 0.12);

    color: #ffc85c;
}


.danger {

    background: var(--red-soft);

    color: var(--red);
}


/* =========================================
   PROGRESS
========================================= */

.progress {

    height: 9px;

    margin: 15px 0;

    background: var(--soft);

    border-radius: 100px;

    overflow: hidden;
}


.progress-fill {

    height: 100%;

    width: 0%;

    background: var(--green);

    border-radius: 100px;

    transition:
        width 0.3s ease;
}


/* =========================================
   COUNTERS
========================================= */

.counters {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;
}


.counter {

    padding: 12px;

    background: var(--soft);

    border:
        1px solid var(--border);

    border-radius: 13px;
}


.counter strong {

    display: block;

    font-size: 18px;
}


.counter span {

    color: var(--muted);

    font-size: 9px;
}


/* =========================================
   TIP
========================================= */

.tip {

    margin-top: 12px;

    padding: 11px 12px;

    background: var(--purple-soft);

    color: var(--purple);

    border-radius: 13px;

    font-size: 10px;

    line-height: 1.5;

    font-weight: 650;
}


/* =========================================
   RESET
========================================= */

.reset {

    width: 100%;

    margin-top: 14px;

    padding: 10px;

    border:
        1px solid var(--border);

    border-radius: 11px;

    background: var(--card);

    color: var(--muted);

    font-size: 10px;

    font-weight: 700;

    cursor: pointer;
}


/* =========================================
   HISTORY & SETTINGS STYLES
========================================= */

.history-list {

    display: flex;

    flex-direction: column;

    gap: 8px;

    max-height: 400px;

    overflow-y: auto;
}


.history-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 10px 12px;

    background: var(--soft);

    border-radius: 12px;

    font-size: 11px;

    font-weight: 700;
}


.history-item .status-badge {

    padding: 4px 8px;

    border-radius: 8px;

    font-size: 10px;

    text-transform: capitalize;
}


.setting-item {

    margin-bottom: 18px;
}


.setting-item label {

    display: block;

    font-size: 11px;

    font-weight: 750;

    color: var(--muted);

    margin-bottom: 6px;
}


.setting-input {

    width: 100%;

    padding: 10px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background: var(--card);

    color: var(--text);

    font-size: 13px;

    font-weight: 700;

    outline: none;
}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav {

    position: fixed;

    left: 50%;

    bottom: 0;

    transform:
        translateX(-50%);

    width:
        min(480px, 100%);

    padding:
        10px 20px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    background:
        color-mix(
            in srgb,
            var(--card) 95%,
            transparent
        );

    backdrop-filter:
        blur(15px);

    border-top:
        1px solid var(--border);

    z-index: 100;
}


.nav {

    display: flex;

    justify-content:
        space-around;
}


.nav-item {

    text-align: center;

    color: var(--muted);

    font-size: 9px;

    font-weight: 750;

    cursor: pointer;
}


.nav-icon {

    margin-bottom: 3px;

    font-size: 18px;
}


.nav-item.active {

    color: var(--purple);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 360px) {

    .attendance-popup {

        width: 100px;
    }

    .attendance-popup button {

        font-size: 8px;
    }
}

</style>
</head>


<body>


<div class="app">


<!-- =====================================

===================================== -->

<header>

        </div>

        <div>

            <h1>

            </h1>

            </p>

    <div class="header-buttons">


        <!-- TODAY -->

        <button
            class="header-btn"

        </button>

</header>

        <div class="weekdays">

        <div

    <section class="card attendance-card">

            <div class="label">

<script>

/* =========================================
   STORAGE KEYS & DATA
========================================= */

const STORAGE_KEY = "attendixAttendance";
const THEME_KEY = "attendixTheme";
const SETTINGS_KEY = "attendixSettings";

let attendance = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "{}"
);

let settings = JSON.parse(
    localStorage.getItem(SETTINGS_KEY) || '{"target": 75}'
);

let currentDate = new Date();
let selectedDate = null;


/* =========================================
   ELEMENT HELPER
========================================= */

function $(id) {
    return document.getElementById(id);
}


/* =========================================
   DATE KEY
========================================= */

function makeKey(year, month, day) {
    return (
        year +
        "-" +
        String(month + 1).padStart(2, "0") +
        "-" +
        String(day).padStart(2, "0")
    );
}


/* =========================================
   SAVE DATA
========================================= */

function saveData() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(attendance)
    );
}


/* =========================================
   RENDER CALENDAR
========================================= */

function renderCalendar() {

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    $("monthName").textContent = currentDate.toLocaleString("en-US", { month: "long" });
    $("year").textContent = year;

    const calendar = $("calendar");
    calendar.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    /* EMPTY CELLS */
    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day";
        calendar.appendChild(empty);
    }

    const today = new Date();

    /* DAYS */
    for (let day = 1; day <= daysInMonth; day++) {

        const dateKey = makeKey(year, month, day);

        const wrapper = document.createElement("div");
        wrapper.className = "day-wrapper";

        const button = document.createElement("button");
        button.className = "day";
        button.innerHTML = `<span>${day}</span>`;

        /* ATTENDANCE STATUS */
        if (attendance[dateKey]) {
            button.classList.add(attendance[dateKey]);
            const dot = document.createElement("span");
            dot.className = "status-dot";
            button.appendChild(dot);
        }

        /* TODAY */
        if (
            year === today.getFullYear() &&
            month === today.getMonth() &&
            day === today.getDate()
        ) {
            button.classList.add("today");
        }

        /* SELECTED */
        if (dateKey === selectedDate) {
            button.classList.add("selected");
            wrapper.classList.add("active");
        }

        /* POPUP */
        const popup = document.createElement("div");
        popup.className = "attendance-popup";

        /* PRESENT BUTTON */
        const present = document.createElement("button");
        present.className = "popup-present";
        present.textContent = "✓ Present";

        present.addEventListener("click", function(event) {
            event.stopPropagation();
            markAttendance(dateKey, "present");
        });

        /* ABSENT BUTTON */
        const absent = document.createElement("button");
        absent.className = "popup-absent";
        absent.textContent = "✕ Absent";

        absent.addEventListener("click", function(event) {
            event.stopPropagation();
            markAttendance(dateKey, "absent");
        });

        popup.appendChild(present);
        popup.appendChild(absent);

        wrapper.appendChild(button);
        wrapper.appendChild(popup);
        calendar.appendChild(wrapper);

        /* DATE CLICK */
        button.addEventListener("click", function(event) {
            event.stopPropagation();
            selectDate(dateKey);
        });
    }
}


/* =========================================
   SELECT DATE
========================================= */

function selectDate(dateKey) {
    if (selectedDate === dateKey) {
        selectedDate = null;
    } else {
        selectedDate = dateKey;
    }
    renderCalendar();
}


/* =========================================
   MARK ATTENDANCE
========================================= */

function markAttendance(dateKey, status) {
    attendance[dateKey] = status;
    selectedDate = dateKey;
    saveData();
    renderCalendar();
    updateStatistics();
}


/* =========================================
   UPDATE STATISTICS
========================================= */

function updateStatistics() {

    const values = Object.values(attendance);

    const present = values.filter(value => value === "present").length;
    const absent = values.filter(value => value === "absent").length;
    const total = present + absent;

    let percentage = 0;
    if (total > 0) {
        percentage = (present / total) * 100;
    }

    $("presentCount").textContent = present;
    $("absentCount").textContent = absent;

    $("percentage").innerHTML = (total ? percentage.toFixed(1) : "0") + "<span>%</span>";
    $("progressFill").style.width = percentage + "%";

    const status = $("status");
    status.className = "status";

    const targetPct = settings.target || 75;
    const warningPct = Math.max(targetPct - 15, 50);

    if (total === 0) {
        status.textContent = "No data";
        $("tip").textContent = "Select a date to mark your attendance.";
    } else if (percentage >= targetPct) {
        status.textContent = "✓ Safe";
        status.classList.add("safe");
        $("tip").textContent = `Great! Your attendance is above the ${targetPct}% target.`;
    } else if (percentage >= warningPct) {
        status.textContent = "⚠ Attention";
        status.classList.add("warning");
        $("tip").textContent = `Your attendance is getting close to the ${targetPct}% target.`;
    } else {
        status.textContent = "✕ Low";
        status.classList.add("danger");
        $("tip").textContent = `Your attendance is below ${targetPct}%. Try to attend upcoming classes.`;
    }
}


/* =========================================
   TAB SWITCHING LOGIC
========================================= */

document.querySelectorAll(".nav-item").forEach(item => {
    item.addEventListener("click", function() {
        document.querySelectorAll(".nav-item").forEach(nav => nav.classList.remove("active"));
        this.classList.add("active");

        const targetViewId = this.getAttribute("data-target");
        document.querySelectorAll(".view").forEach(view => {
            view.style.display = view.id === targetViewId ? "block" : "none";
        });

        if (targetViewId === "view-history") renderHistory();
        if (targetViewId === "view-settings") loadSettingsView();
    });
});


/* =========================================
   RENDER HISTORY VIEW
========================================= */

function renderHistory() {
    const historyList = $("historyList");
    historyList.innerHTML = "";

    const keys = Object.keys(attendance).sort().reverse();

    if (keys.length === 0) {
        historyList.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--muted); font-size:11px;">No records marked yet.</div>`;
        return;
    }

    keys.forEach(dateKey => {
        const status = attendance[dateKey];
        const row = document.createElement("div");
        row.className = "history-item";

        const badgeClass = status === "present" ? "safe" : "danger";
        const symbol = status === "present" ? "✓" : "✕";

        row.innerHTML = `
            <span>${dateKey}</span>
            <span class="status-badge ${badgeClass}">${symbol} ${status}</span>
        `;
        historyList.appendChild(row);
    });
}


/* =========================================
   SETTINGS & DATA MANAGEMENT
========================================= */

function loadSettingsView() {
    $("targetInput").value = settings.target || 75;
}

$("targetInput").addEventListener("change", function() {
    const val = parseInt(this.value, 10);
    if (!isNaN(val) && val >= 1 && val <= 100) {
        settings.target = val;
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        updateStatistics();
    }
});

/* EXPORT DATA */
$("exportBtn").addEventListener("click", function() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(attendance));
    const downloadAnchor = document.createElement("a");
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `attendix_backup_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
});

/* IMPORT DATA */
$("importBtn").addEventListener("click", () => $("importFile").click());

$("importFile").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            const importedData = JSON.parse(evt.target.result);
            if (typeof importedData === "object") {
                attendance = importedData;
                saveData();
                renderCalendar();
                updateStatistics();
                alert("Attendance data imported successfully!");
            }
        } catch (err) {
            alert("Invalid JSON file structure.");
        }
    };
    reader.readAsText(file);
});


/* =========================================
   MONTH CONTROLS & HEADER
========================================= */

$("previousMonth").addEventListener("click", function() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    selectedDate = null;
    renderCalendar();
});

$("nextMonth").addEventListener("click", function() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    selectedDate = null;
    renderCalendar();
});

$("todayButton").addEventListener("click", function() {
    currentDate = new Date();
    selectedDate = null;
    renderCalendar();
});


/* =========================================
   DARK MODE CONTROLS
========================================= */

function updateThemeIcon() {
    if (document.body.classList.contains("dark")) {
        $("themeButton").textContent = "☀️";
    } else {
        $("themeButton").textContent = "🌙";
    }
}

const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme === "dark") {
    document.body.classList.add("dark");
}
updateThemeIcon();

$("themeButton").addEventListener("click", function() {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
    updateThemeIcon();
});


/* =========================================
   RESET ATTENDANCE
========================================= */

$("resetButton").addEventListener("click", function() {
    if (confirm("Reset all attendance data?")) {
        attendance = {};
        selectedDate = null;
        localStorage.removeItem(STORAGE_KEY);
        renderCalendar();
        updateStatistics();
    }
});


/* =========================================
   CLOSE POPUP ON OUTSIDE CLICK
========================================= */

document.addEventListener("click", function() {
    if (selectedDate !== null) {
        selectedDate = null;
        renderCalendar();
    }
});


/* =========================================
   START APP
========================================= */

renderCalendar();
updateStatistics();

</script>

</body>
</html>
