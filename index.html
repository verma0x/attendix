<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendix</title>

<style>
/* =========================================
   RESET
========================================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* =========================================
   LIGHT THEME
========================================= */
:root {
    --bg: #f7f7fb;
    --card: #ffffff;
    --text: #171820;
    --muted: #8c8d9b;
    --purple: #6657e8;
    --purple-soft: rgba(102, 87, 232, 0.09);
    --green: #2fb477;
    --green-soft: #e8f8f0;
    --red: #e65b5b;
    --red-soft: #fdecec;
    --border: #ececf2;
    --soft: #f5f4fa;
}

/* =========================================
   DARK THEME
========================================= */
body.dark {
    --bg: #0f1016;
    --card: #181922;
    --text: #f4f4f7;
    --muted: #9294a3;
    --purple: #8275f5;
    --purple-soft: rgba(130, 117, 245, 0.12);
    --green: #3bc98b;
    --green-soft: rgba(59, 201, 139, 0.13);
    --red: #ff7070;
    --red-soft: rgba(255, 112, 112, 0.13);
    --border: #292b36;
    --soft: #22232d;
}

/* =========================================
   BODY
========================================= */
body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background 0.25s ease, color 0.25s ease;
}

/* =========================================
   APP
========================================= */
.app {
    width: 100%;
    max-width: 480px;
    margin: auto;
    padding: 20px 16px 100px;
}

/* =========================================
   HEADER
========================================= */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.logo {
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    background: var(--purple);
    color: white;
    font-size: 22px;
    font-weight: 900;
    box-shadow: 0 8px 20px rgba(102, 87, 232, 0.25);
}

.brand h1 {
    font-size: 23px;
    letter-spacing: -0.5px;
}

.brand p {
    margin-top: 2px;
    color: var(--muted);
    font-size: 10px;
}

/* =========================================
   HEADER BUTTONS
========================================= */
.header-buttons {
    display: flex;
    gap: 7px;
}

.header-btn {
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--card);
    color: var(--purple);
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
}

.header-btn:active {
    transform: scale(0.9);
}

/* =========================================
   CARD
========================================= */
.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(30, 28, 70, 0.06);
    transition: background 0.25s ease, border 0.25s ease;
}

/* =========================================
   SUBJECT SELECTOR CARD
========================================= */
.subject-card {
    padding: 14px 18px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.subject-label {
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.subject-select {
    flex: 1;
    max-width: 250px;
    padding: 8px 12px;
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 11px;
    font-weight: 750;
    outline: none;
    cursor: pointer;
    font-family: inherit;
}

/* =========================================
   CALENDAR CARD
========================================= */
.calendar-card {
    padding: 18px;
    margin-bottom: 15px;
}

.calendar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.month {
    font-size: 18px;
    font-weight: 800;
}

.year {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 10px;
}

.month-controls {
    display: flex;
    gap: 5px;
}

.month-controls button {
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 10px;
    background: var(--soft);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
}

/* =========================================
   WEEK DAYS & GRID
========================================= */
.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 6px;
}

.weekdays div {
    text-align: center;
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}

.day-wrapper {
    position: relative;
    min-width: 0;
    display: flex;
    justify-content: center;
}

.day {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 14px;
    background: transparent;
    color: var(--text);
    font-size: 12px;
    font-weight: 750;
    cursor: pointer;
    position: relative;
    transition: 0.15s;
}

.day:active {
    transform: scale(0.92);
}

.day.today {
    background: rgba(102, 87, 232, 0.08);
    color: var(--purple);
    box-shadow: inset 0 0 0 1.5px rgba(102, 87, 232, 0.4);
}

.day.present {
    background: var(--green-soft);
    color: var(--green);
}

.day.absent {
    background: var(--red-soft);
    color: var(--red);
}

.day.selected {
    box-shadow: inset 0 0 0 2px var(--purple);
    transform: scale(0.94);
    z-index: 10;
}

.status-dot {
    position: absolute;
    width: 5px;
    height: 5px;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 50%;
}

.day.present .status-dot { background: var(--green); }
.day.absent .status-dot { background: var(--red); }

/* =========================================
   ATTENDANCE POPUP
========================================= */
.attendance-popup {
    position: absolute;
    top: 53px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: none;
    width: 112px;
    padding: 5px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
}

.day-wrapper.active .attendance-popup {
    display: flex;
    gap: 4px;
    animation: popupIn 0.16s ease;
}

@keyframes popupIn {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(-4px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
    }
}

.attendance-popup button {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 8px 4px;
    font-size: 9px;
    font-weight: 850;
    cursor: pointer;
}

.popup-present {
    background: var(--green-soft);
    color: var(--green);
}

.popup-absent {
    background: var(--red-soft);
    color: var(--red);
}

/* =========================================
   LEGEND
========================================= */
.legend {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 16px;
    color: var(--muted);
    font-size: 10px;
}

.legend-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 4px;
    border-radius: 50%;
}

.legend-green { background: var(--green); }
.legend-red { background: var(--red); }

/* =========================================
   ATTENDANCE CARD
========================================= */
.attendance-card {
    padding: 20px;
}

.attendance-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
}

.label {
    color: var(--muted);
    font-size: 9px;
    font-weight: 850;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.percentage {
    margin-top: 5px;
    font-size: 43px;
    font-weight: 900;
    letter-spacing: -2px;
}

.percentage span {
    color: var(--muted);
    font-size: 18px;
    letter-spacing: 0;
}

.status {
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 9px;
    font-weight: 850;
}

.safe {
    background: var(--green-soft);
    color: var(--green);
}

.warning {
    background: #fff5dd;
    color: #a87816;
}

body.dark .warning {
    background: rgba(255, 190, 60, 0.12);
    color: #ffc85c;
}

.danger {
    background: var(--red-soft);
    color: var(--red);
}

.progress {
    height: 9px;
    margin: 15px 0;
    background: var(--soft);
    border-radius: 100px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: var(--green);
    border-radius: 100px;
    transition: width 0.3s ease;
}

.counters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.counter {
    padding: 12px;
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 13px;
}

.counter strong {
    display: block;
    font-size: 18px;
}

.counter span {
    color: var(--muted);
    font-size: 9px;
}

.tip {
    margin-top: 12px;
    padding: 11px 12px;
    background: var(--purple-soft);
    color: var(--purple);
    border-radius: 13px;
    font-size: 10px;
    line-height: 1.5;
    font-weight: 650;
}

.reset {
    width: 100%;
    margin-top: 14px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--card);
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
}
</style>
</head>

<body>
<div class="app">

    <!-- HEADER -->
    <header>
        <div class="brand">
            <div class="logo">✓</div>
            <div>
                <h1>Attendix</h1>
                <p>Smart attendance tracker</p>
            </div>
        </div>
        <div class="header-buttons">
            <button class="header-btn" id="todayButton" title="Today">⌾</button>
            <button class="header-btn" id="themeButton" title="Toggle theme">🌙</button>
        </div>
    </header>

    <!-- SUBJECT SELECTOR -->
    <section class="card subject-card">
        <span class="subject-label">Subject</span>
        <select class="subject-select" id="subjectSelect">
            <option value="ALL">All Subjects (Overall)</option>
            <option value="SSE">SSE</option>
            <option value="Maths Foundation">Maths Foundation</option>
            <option value="Programming">Programming</option>
            <option value="Language">Language</option>
            <option value="Creative Thinking">Creative Thinking</option>
            <option value="Organizational Behaviour">Organizational Behaviour</option>
            <option value="Sensor and Automation">Sensor and Automation</option>
            <option value="DD&CO">DD&CO</option>
            <option value="Mentor Mentee">Mentor Mentee</option>
        </select>
    </section>

    <!-- CALENDAR CARD -->
    <section class="card calendar-card">
        <div class="calendar-top">
            <div>
                <div class="month" id="monthName"></div>
                <span class="year" id="year"></span>
            </div>
            <div class="month-controls">
                <button id="previousMonth">‹</button>
                <button id="nextMonth">›</button>
            </div>
        </div>

        <div class="weekdays">
            <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
        </div>

        <div class="calendar" id="calendar"></div>

        <div class="legend">
            <span><i class="legend-dot legend-green"></i> Present</span>
            <span><i class="legend-dot legend-red"></i> Absent</span>
        </div>
    </section>

    <!-- ATTENDANCE SUMMARY -->
    <section class="card attendance-card">
        <div class="attendance-header">
            <div>
                <div class="label" id="attendanceSummaryLabel">Overall Attendance</div>
                <div class="percentage" id="percentage">0<span>%</span></div>
            </div>
            <div class="status" id="status">No data</div>
        </div>

        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="counters">
            <div class="counter">
                <strong id="presentCount">0</strong>
                <span>Present classes</span>
            </div>
            <div class="counter">
                <strong id="absentCount">0</strong>
                <span>Absent classes</span>
            </div>
        </div>

        <div class="tip" id="tip">Select a date to mark your attendance.</div>
        <button class="reset" id="resetButton">Reset attendance data</button>
    </section>

</div>

<script>
/* =========================================
   STORAGE & STATE
========================================= */
const SUBJECTS = [
    "SSE",
    "Maths Foundation",
    "Programming",
    "Language",
    "Creative Thinking",
    "Organizational Behaviour",
    "Sensor and Automation",
    "DD&CO",
    "Mentor Mentee"
];

const STORAGE_KEY = "attendixAttendance_v2";
const THEME_KEY = "attendixTheme";
const ACTIVE_SUB_KEY = "attendixActiveSubject";

// Schema: { "YYYY-MM-DD": { "SubjectName": "present" | "absent" } }
let attendance = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let activeSubject = localStorage.getItem(ACTIVE_SUB_KEY) || "ALL";
let currentDate = new Date();
let selectedDate = null;

const $ = (id) => document.getElementById(id);

function makeKey(year, month, day) {
    return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(attendance));
}

/* =========================================
   SUBJECT HELPERS
========================================= */
function getStatus(dateKey, subject) {
    const dayObj = attendance[dateKey];
    if (!dayObj) return null;

    if (subject !== "ALL") {
        return dayObj[subject] || null;
    }

    const statuses = Object.values(dayObj);
    if (statuses.length === 0) return null;

    const presentCount = statuses.filter(s => s === "present").length;
    const absentCount = statuses.filter(s => s === "absent").length;

    if (presentCount === 0 && absentCount === 0) return null;
    return presentCount >= absentCount ? "present" : "absent";
}

/* =========================================
   CALENDAR RENDER
========================================= */
function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    $("monthName").textContent = currentDate.toLocaleString("en-US", { month: "long" });
    $("year").textContent = year;

    const calendar = $("calendar");
    calendar.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();

    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day";
        calendar.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = makeKey(year, month, day);

        const wrapper = document.createElement("div");
        wrapper.className = "day-wrapper";

        const button = document.createElement("button");
        button.className = "day";
        button.innerHTML = `<span>${day}</span>`;

        const dayStatus = getStatus(dateKey, activeSubject);

        if (dayStatus) {
            button.classList.add(dayStatus);
            const dot = document.createElement("span");
            dot.className = "status-dot";
            button.appendChild(dot);
        }

        if (
            year === today.getFullYear() &&
            month === today.getMonth() &&
            day === today.getDate()
        ) {
            button.classList.add("today");
        }

        if (dateKey === selectedDate) {
            button.classList.add("selected");
            wrapper.classList.add("active");
        }

        const popup = document.createElement("div");
        popup.className = "attendance-popup";

        const present = document.createElement("button");
        present.className = "popup-present";
        present.textContent = "✓ Present";
        present.onclick = (e) => {
            e.stopPropagation();
            markAttendance(dateKey, "present");
        };

        const absent = document.createElement("button");
        absent.className = "popup-absent";
        absent.textContent = "✕ Absent";
        absent.onclick = (e) => {
            e.stopPropagation();
            markAttendance(dateKey, "absent");
        };

        popup.appendChild(present);
        popup.appendChild(absent);
        wrapper.appendChild(button);
        wrapper.appendChild(popup);
        calendar.appendChild(wrapper);

        button.onclick = (e) => {
            e.stopPropagation();
            selectedDate = (selectedDate === dateKey) ? null : dateKey;
            renderCalendar();
        };
    }
}

function markAttendance(dateKey, status) {
    if (!attendance[dateKey]) {
        attendance[dateKey] = {};
    }

    if (activeSubject === "ALL") {
        SUBJECTS.forEach(sub => {
            attendance[dateKey][sub] = status;
        });
    } else {
        attendance[dateKey][activeSubject] = status;
    }

    selectedDate = dateKey;
    saveData();
    renderCalendar();
    updateStatistics();
}

/* =========================================
   STATISTICS
========================================= */
function updateStatistics() {
    let present = 0;
    let absent = 0;

    for (const dayRecords of Object.values(attendance)) {
        if (activeSubject === "ALL") {
            for (const status of Object.values(dayRecords)) {
                if (status === "present") present++;
                if (status === "absent") absent++;
            }
        } else {
            const status = dayRecords[activeSubject];
            if (status === "present") present++;
            if (status === "absent") absent++;
        }
    }

    const total = present + absent;
    const percentage = total > 0 ? (present / total) * 100 : 0;

    $("attendanceSummaryLabel").textContent = activeSubject === "ALL" ? "Overall Attendance" : `${activeSubject} Attendance`;
    $("presentCount").textContent = present;
    $("absentCount").textContent = absent;
    $("percentage").innerHTML = `${total ? percentage.toFixed(1) : "0"}<span>%</span>`;
    $("progressFill").style.width = `${percentage}%`;

    const status = $("status");
    status.className = "status";

    if (total === 0) {
        status.textContent = "No data";
        $("tip").textContent = "Select a date to mark your attendance.";
    } else if (percentage >= 75) {
        status.textContent = "✓ Safe";
        status.classList.add("safe");
        $("tip").textContent = "Great! Your attendance is above the 75% target.";
    } else if (percentage >= 60) {
        status.textContent = "⚠ Attention";
        status.classList.add("warning");
        $("tip").textContent = "Your attendance is getting close to the 75% target.";
    } else {
        status.textContent = "✕ Low";
        status.classList.add("danger");
        $("tip").textContent = "Your attendance is below 75%. Try to attend upcoming classes.";
    }
}

/* =========================================
   SUBJECT SELECT EVENT
========================================= */
const subjectSelect = $("subjectSelect");
subjectSelect.value = activeSubject;

subjectSelect.onchange = function() {
    activeSubject = this.value;
    localStorage.setItem(ACTIVE_SUB_KEY, activeSubject);
    selectedDate = null;
    renderCalendar();
    updateStatistics();
};

/* =========================================
   CONTROLS & LISTENERS
========================================= */
$("previousMonth").onclick = () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    selectedDate = null;
    renderCalendar();
};

$("nextMonth").onclick = () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    selectedDate = null;
    renderCalendar();
};

$("todayButton").onclick = () => {
    currentDate = new Date();
    selectedDate = null;
    renderCalendar();
};

function updateThemeIcon() {
    $("themeButton").textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
}

if (localStorage.getItem(THEME_KEY) === "dark") {
    document.body.classList.add("dark");
}
updateThemeIcon();

$("themeButton").onclick = () => {
    document.body.classList.toggle("dark");
    localStorage.setItem(THEME_KEY, document.body.classList.contains("dark") ? "dark" : "light");
    updateThemeIcon();
};

$("resetButton").onclick = () => {
    const label = activeSubject === "ALL" ? "all attendance data" : `data for ${activeSubject}`;
    if (confirm(`Reset ${label}?`)) {
        if (activeSubject === "ALL") {
            attendance = {};
        } else {
            for (const dateKey of Object.keys(attendance)) {
                delete attendance[dateKey][activeSubject];
                if (Object.keys(attendance[dateKey]).length === 0) {
                    delete attendance[dateKey];
                }
            }
        }
        selectedDate = null;
        saveData();
        renderCalendar();
        updateStatistics();
    }
};

document.onclick = () => {
    if (selectedDate !== null) {
        selectedDate = null;
        renderCalendar();
    }
};

/* =========================================
   INIT
========================================= */
renderCalendar();
updateStatistics();
</script>
</body>
</html>
