<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f7f7fb"
    >

    <title>Attendix</title>


    <style>

        /* ==============================
           RESET
        ============================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==============================
           COLORS
        ============================== */

        :root {

            --bg: #f7f7fb;

            --white: #ffffff;

            --text: #171820;

            --muted: #898c9c;

            --border: #ececf2;

            --purple: #6657e8;

            --purple-light: #eeebff;

            --green: #2fb477;

            --green-light: #e8f8f0;

            --red: #e65b5b;

            --red-light: #fdecec;

        }


        /* ==============================
           BODY
        ============================== */

        body {

            min-height: 100vh;

            background: var(--bg);

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

        }


        /* ==============================
           APP CONTAINER
        ============================== */

        .app {

            width: 100%;

            max-width: 480px;

            min-height: 100vh;

            margin: auto;

            padding: 20px 16px 100px;

        }


        /* ==============================
           HEADER
        ============================== */

        header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 5px 2px 22px;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 11px;

        }


        .logo {

            width: 45px;

            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 15px;

            background: var(--purple);

            color: white;

            font-size: 22px;

            font-weight: 900;

            box-shadow:
                0 8px 20px
                rgba(102, 87, 232, 0.25);

        }


        .brand h1 {

            font-size: 23px;

            letter-spacing: -0.7px;

        }


        .brand p {

            margin-top: 2px;

            color: var(--muted);

            font-size: 10px;

        }


        .today-button {

            width: 40px;

            height: 40px;

            border: 1px solid var(--border);

            border-radius: 13px;

            background: var(--white);

            color: var(--purple);

            font-size: 18px;

            cursor: pointer;

        }
