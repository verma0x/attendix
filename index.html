<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendix | verma0x </title>
  <style>
    /* =========================================
       CSS VARIABLES & THEME STYLES
    ========================================= */
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --accent-color: #4f46e5;
      --accent-glow: rgba(79, 70, 229, 0.4);
      --present-bg: #dcfce7;
      --present-text: #15803d;
      --absent-bg: #fee2e2;
      --absent-text: #b91c1c;
    }

    body.dark {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.5);
      --present-bg: #064e3b;
      --present-text: #6ee7b7;
      --absent-bg: #7f1d1d;
      --absent-text: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* =========================================
       HEADER & ANIMATED LOGO / STREAK
    ========================================= */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Animated Glowing Attendix Logo */
    .attendix-logo {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 0 8px var(--accent-glow));
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% {
        filter: drop-shadow(0 0 4px var(--accent-glow));
        transform: scale(1);
      }
      50% {
        filter: drop-shadow(0 0 14px var(--accent-color));
        transform: scale(1.05);
      }
    }

    .logo-title {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-color), #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Animated Streak Fire */
    .streak-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      padding: 0.4rem 0.8rem;
      border-radius: 2rem;
      font-weight: 700;
      color: #f97316;
    }

    .fire-icon {
      width: 22px;
      height: 22px;
      transform-origin: center bottom;
      animation: flicker 1.2s infinite ease-in-out alternate;
    }

    @keyframes flicker {
      0% {
        transform: scale(0.95) rotate(-3deg);
        filter: drop-shadow(0 0 2px #f97316);
      }
      50% {
        transform: scale(1.1) rotate(3deg);
        filter: drop-shadow(0 0 8px #ef4444);
      }
      100% {
        transform: scale(1) rotate(-1deg);
        filter: drop-shadow(0 0 5px #eab308);
      }
    }

    .controls {
      display: flex;
      gap: 0.5rem;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .btn-icon:hover {
      background: var(--border-color);
    }

    /* =========================================
       STATS DASHBOARD
    ========================================= */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 0.8rem;
      padding: 1rem;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* =========================================
       CALENDAR SECTION
    ========================================= */
    .calendar-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.5rem;
      position: relative;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
      margin-top: 1rem;
      text-align: center;
    }

    .day-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      padding-bottom: 0.5rem;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      position: relative;
    }

    .day-cell:hover {
      border-color: var(--accent-color);
    }

    .day-cell.present {
      background-color: var(--present-bg);
      color: var(--present-text);
      border-color: transparent;
    }

    .day-cell.absent {
      background-color: var(--absent-bg);
      color: var(--absent-text);
      border-color: transparent;
    }

    /* Action Popup */
    .action-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      border-radius: 0.8rem;
      padding: 0.75rem;
      display: flex;
      gap: 0.5rem;
      z-index: 10;
    }

    .btn-action {
      padding: 0.5rem 0.8rem;
      border-radius: 0.4rem;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-present { background: #22c55e; color: white; }
    .btn-absent { background: #ef4444; color: white; }
    .btn-clear { background: var(--border-color); color: var(--text-primary); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <!-- SVG Animated Attendix Logo -->
        <svg class="attendix-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="8" class="text-indigo" style="color: var(--accent-color)" />
          <path d="M30 52 L43 65 L70 35" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color)" />
        </svg>
        <span class="logo-title">Attendix</span>
      </div>

      <div class="streak-badge">
        <!-- Animated Flame SVG -->
        <svg class="fire-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 23C16.4183 23 20 19.4183 20 15C20 10.5 16 7 14 3C13.5 6 11.5 8 9.5 8C7 8 5 6 5 6C4 9 4 11.5 4 15C4 19.4183 7.58172 23 12 23Z" fill="#F97316"/>
          <path d="M12 23C14.2091 23 16 21.2091 16 19C16 16.5 14 14.5 13 12.5C12.5 14 11 15 9.5 15C8 15 7 14 7 14C6.5 15.5 6.5 17 6.5 19C6.5 21.2091 8.79086 23 12 23Z" fill="#FACC15"/>
        </svg>
        <span id="streakCount">0</span> Days
      </div>

      <div class="controls">
        <button class="btn-icon" id="themeButton" title="Toggle Theme">🌙</button>
        <button class="btn-icon" id="resetButton" title="Reset History">🔄</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Present</div>
        <div class="stat-value" id="presentCount" style="color: #22c55e;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Absent</div>
        <div class="stat-value" id="absentCount" style="color: #ef4444;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rate</div>
        <div class="stat-value" id="attendanceRate">0%</div>
      </div>
    </div>

    <div class="calendar-card" id="calendarCard">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 id="monthYear">September 2026</h2>
      </div>
      <div class="calendar-grid" id="calendar">
        <!-- Calendar days injected dynamically -->
      </div>
    </div>
  </div>

  <script>
    /* =========================================
       STATE & DOM ELEMENTS
    ========================================= */
    const STORAGE_KEY = "attendix_data_v1";
    const THEME_KEY = "attendix_theme";
    
    let attendance = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    let selectedDate = null;

    const $ = (id) => document.getElementById(id);

    /* =========================================
       CALENDAR RENDER LOGIC
    ========================================= */
    function renderCalendar() {
      const calendarEl = $("calendar");
      calendarEl.innerHTML = "";

      const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      daysOfWeek.forEach(day => {
        const dayHead = document.createElement("div");
        dayHead.className = "day-name";
        dayHead.textContent = day;
        calendarEl.appendChild(dayHead);
      });

      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      // Empty padding cells
      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement("div");
        calendarEl.appendChild(emptyCell);
      }

      // Day cells
      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayCell = document.createElement("div");
        dayCell.className = "day-cell";
        dayCell.textContent = day;

        if (attendance[dateStr] === "P") dayCell.classList.add("present");
        if (attendance[dateStr] === "A") dayCell.classList.add("absent");

        dayCell.addEventListener("click", (e) => {
          e.stopPropagation();
          showActionPopup(dayCell, dateStr);
        });

        calendarEl.appendChild(dayCell);
      }
    }

    function showActionPopup(targetEl, dateStr) {
      removeExistingPopups();

      const popup = document.createElement("div");
      popup.className = "action-popup";
      popup.innerHTML = `
        <button class="btn-action btn-present" onclick="setAttendance('${dateStr}', 'P')">Present</button>
        <button class="btn-action btn-absent" onclick="setAttendance('${dateStr}', 'A')">Absent</button>
        <button class="btn-action btn-clear" onclick="setAttendance('${dateStr}', null)">Clear</button>
      `;

      targetEl.appendChild(popup);
    }

    function removeExistingPopups() {
      document.querySelectorAll(".action-popup").forEach(el => el.remove());
    }

    /* =========================================
       ATTENDANCE & STATISTICS ENGINE
    ========================================= */
    function setAttendance(dateStr, status) {
      if (status === null) {
        delete attendance[dateStr];
      } else {
        attendance[dateStr] = status;
      }
      saveData();
      renderCalendar();
      updateStatistics();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(attendance));
    }

    function updateStatistics() {
      const values = Object.values(attendance);
      const presentCount = values.filter(val => val === "P").length;
      const absentCount = values.filter(val => val === "A").length;
      const totalRecorded = presentCount + absentCount;

      $("presentCount").textContent = presentCount;
      $("absentCount").textContent = absentCount;
      
      const rate = totalRecorded > 0 ? Math.round((presentCount / totalRecorded) * 100) : 0;
      $("attendanceRate").textContent = `${rate}%`;

      // Calculate streak
      let streak = 0;
      const sortedDates = Object.keys(attendance).sort().reverse();
      for (let date of sortedDates) {
        if (attendance[date] === "P") {
          streak++;
        } else if (attendance[date] === "A") {
          break;
        }
      }
      $("streakCount").textContent = streak;
    }

    /* =========================================
       THEME & SYSTEM CONTROLS
    ========================================= */
    function updateThemeIcon() {
      const isDark = document.body.classList.contains("dark");
      $("themeButton").textContent = isDark ? "☀️" : "🌙";
    }

    // Load theme preference
    const savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme === "dark") {
      document.body.classList.add("dark");
    }
    updateThemeIcon();

    // Theme toggle handler
    $("themeButton").addEventListener("click", function() {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
      updateThemeIcon();
    });

    // Reset button handler
    $("resetButton").addEventListener("click", function() {
      if (confirm("Are you sure you want to clear all attendance history?")) {
        attendance = {};
        saveData();
        renderCalendar();
        updateStatistics();
      }
    });

    // Deselect popup on outside click
    document.addEventListener("click", function(event) {
      if (!event.target.closest("#calendar")) {
        removeExistingPopups();
      }
    });

    /* =========================================
       INITIALIZATION
    ========================================= */
    renderCalendar();
    updateStatistics();
  </script>
</body>
</html>
